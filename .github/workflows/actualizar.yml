name: Actualizar ZapTV

on:
  schedule:
    - cron: "0 9 * * 1"   # lunes 06:00 hora Argentina
  workflow_dispatch:        # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sin --check: los servidores de GitHub están en EE.UU.,
      # así que probar streams desde ahí daría resultados engañosos
      # (descartaría canales argentinos que en tu casa andan).
      - name: Generar playlist
        run: python build.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ZapTV.m3u
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática de ZapTV.m3u"
            git push
          fi
